name: Build add-on images

on:
  push:
    branches: [main]
    paths:
      - "whatsapp-bridge/**"
      - ".github/workflows/builder.yml"
  release:
    types: [published]
  workflow_dispatch:

env:
  ADDON_SLUG: whatsapp-bridge

jobs:
  init:
    name: Detect add-on
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed_addon.outputs.changed }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed_files
        uses: jitterbit/get-changed-files@v1
        continue-on-error: true

      - name: Detect changed add-on
        id: changed_addon
        run: |
          if [[ "${{ github.event_name }}" == "release" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Read add-on info
        id: info
        run: |
          version=$(yq '.version' whatsapp-bridge/config.yaml)
          echo "version=${version}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: init
    if: needs.init.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on
        uses: home-assistant/builder@2024.08.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target whatsapp-bridge \
            --addon
